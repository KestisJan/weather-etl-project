services:
  db:
    image: postgres:15
    container_name: weather_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: weather_db
    ports:
      - "5232:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: